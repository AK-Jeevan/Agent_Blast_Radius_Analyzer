# =============================================================================
# Supply-chain and static security checks.
# =============================================================================
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1"   # weekly, off-peak
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || echo "::warning::pip-audit reported findings above"

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt bandit
      - name: Bandit (application code only)
        run: bandit -r app -x app/services/loader.py -q
      - name: The analyzer must not execute what it analyses
        # Subprocess/shell usage anywhere in app/ would break the read-only guarantee.
        run: |
          if grep -rn --include='*.py' -E '\b(subprocess|os\.system|os\.popen)\b' app; then
            echo "::error::arbitrary execution found in app/"; exit 1
          fi
          echo "read-only invariant holds"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan over the full history
        run: |
          if git grep -nEI '(nvapi-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- ':!docs' ':!*.md'; then
            echo "::error::secret-like material found in tracked files"; exit 1
          fi
          echo "no secrets in tracked files"

  container:
    runs-on: ubuntu-latest
    needs: [audit, static-analysis, secrets]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t agent-blast-radius-analyzer:ci .
      - name: Smoke test the API inside the image
        run: |
          docker run -d --name analyzer -p 8000:8000 agent-blast-radius-analyzer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/analyze \
            -H 'content-type: application/json' \
            -d '{"scenario_id":"scenario-07","run_mode":"A_deterministic"}' \
            | head -c 400
          docker rm -f analyzer
